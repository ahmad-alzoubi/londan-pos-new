name: Build Windows Setup Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Build Windows Setup Installer (NSIS .exe)
        run: npx electron-builder --win nsis --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Londan-POS-Windows-Setup
          path: release/*.exe

      - name: Create GitHub Release & Upload Setup.exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          files: release/*.exe
          generate_release_notes: true
          name: "بوتيك لندن للأزياء - برنامج التثبيت لويندوز Setup.exe"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
