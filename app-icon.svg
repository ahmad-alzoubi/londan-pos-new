<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Boutique Hanger / Bag Symbol -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Hanger Hook -->
    <path d="M256 130 C256 100, 275 80, 295 80 C315 80, 330 95, 330 115 C330 135, 315 145, 290 155 L256 170" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" />
    
    <!-- Hanger Body -->
    <path d="M120 270 L256 185 L392 270 C405 278, 410 295, 400 305 C390 315, 375 310, 365 305 L256 240 L147 305 C137 310, 122 315, 112 305 C102 295, 107 278, 120 270 Z" fill="url(#primaryGrad)" />
    
    <!-- Crossbar -->
    <line x1="130" y1="290" x2="382" y2="290" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" stroke-opacity="0.8" />
    
    <!-- Shopping Bag Details -->
    <rect x="166" y="305" width="180" height="130" rx="20" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="8" />
    <path d="M216 305 C216 265, 296 265, 296 305" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />
    <circle cx="256" cy="370" r="14" fill="url(#goldGrad)" />
  </g>

  <!-- Title Text -->
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="4">LONDAN POS</text>
</svg>